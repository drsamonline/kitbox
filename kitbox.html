<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitbox — Offline Toolbox</title>
<meta name="description" content="Kitbox — a single-file offline toolbox. Every tool runs locally in your browser: no server, no account, no tracking, no network.">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark light">
<!-- Everything the page needs is in the page. This says so in a way the
     browser enforces: no network of any kind, no frames, no forms, and images
     only from data: or blob: URIs that the app itself created. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0e14'/%3E%3Crect x='6' y='10' width='20' height='14' fill='%232f86eb'/%3E%3Crect x='6' y='14' width='20' height='2.5' fill='%230b0e14'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#17171d;
    --ink-soft:#5a5a62;
    --paper:#0b0e14;
    --panel:#ffffff;
    --line:#e4e4e2;
    --line-strong:#d8d8d5;
    --muted:#9a9a9f;
    --shell-muted:#a7adb9;
    --radius:0px;
    --tile-gap:6px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
    --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  :focus-visible{ outline:2px solid var(--accent, #2f86eb); outline-offset:2px; }
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--shell-muted);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Top bar (Windows 10 dark chrome) ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:16px;
    padding:16px 22px;
    background:#0e121a;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .backbtn{
    width:34px;height:34px;border-radius:0;border:none;
    background:transparent; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none; color:#fff;
  }
  .backbtn:hover{background:rgba(255,255,255,0.09);}
  .backbtn svg{width:18px;height:18px;}
  .backbtn.hidden{visibility:hidden;}
  .brand{
    font-family:var(--sans); font-weight:600; letter-spacing:0.01em;
    font-size:15px; display:flex; align-items:center; gap:9px; color:#fff;
  }
  .brand .dot{width:12px;height:12px;border-radius:0;background:var(--accent,#2f86eb); transition:background .2s;}
  .crumb{
    font-size:13.5px; color:var(--shell-muted); margin-left:2px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .crumb b{color:#fff; font-weight:600;}

  /* ---------- Layout ---------- */
  .wrap{max-width:1040px; margin:0 auto; padding:32px 22px 80px;}
  .hero{
    display:flex; gap:18px; align-items:flex-start;
    padding:6px 2px 32px;
  }
  .hero .badge{
    flex:none; width:52px; height:52px; border-radius:0;
    background:var(--accent, #2f86eb); color:#fff;
    border:none;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:700; font-size:12px;
  }
  .hero h1{font-size:26px; margin:2px 0 10px; letter-spacing:-0.01em; font-weight:600; color:#fff;}
  .hero p{font-size:14.5px; color:var(--shell-muted); margin:0; max-width:58ch; line-height:1.6;}

  .section-label{
    font-family:var(--sans); font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--shell-muted); margin:0 2px 12px; font-weight:600;
  }

  /* ---------- Grid & tiles (Windows 10 Start Menu style) ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:var(--tile-gap);
  }
  @media(min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:900px){ .grid{grid-template-columns:repeat(4,1fr);} }

  .tag{
    position:relative;
    background:var(--c, var(--accent, #2f86eb));
    border:none; border-radius:var(--radius);
    padding:14px; cursor:pointer; text-align:left;
    color:#fff;
    transition:filter .1s ease, transform .06s ease;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08);
    display:flex; flex-direction:column; justify-content:space-between; gap:16px; min-height:112px;
  }
  .tag:hover{ filter:brightness(1.12); }
  .tag:active{ transform:scale(0.95); filter:brightness(0.92); }
  .tag .hole{ display:none; }
  .tag .icon{
    width:28px; height:28px; border-radius:0;
    background:transparent;
    color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .tag .icon svg{width:22px;height:22px;}
  .tag .name{font-size:13.5px; font-weight:600; line-height:1.25; color:var(--ci,#fff);}
  .tag .code{color:var(--ci,#fff);
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; color:rgba(255,255,255,0.8); margin-top:auto;
  }
  .tag.disabled{opacity:0.35; cursor:default; filter:grayscale(0.7);}
  .tag.disabled:hover{filter:grayscale(0.7);}

  .catband{
    border-radius:0; padding:0 0 8px; margin-bottom:28px;
  }

  /* ---------- Tool detail panel (light "app window") ---------- */
  .panel{
    background:var(--panel); border:none; border-radius:var(--radius);
    padding:30px; margin-top:4px; color:var(--ink);
    box-shadow:0 1px 0 rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.05);
  }
  .panel h2{margin:0 0 10px; font-size:20px; font-weight:600; color:var(--ink);}
  .panel .code-pill{
    display:inline-block; font-family:var(--mono); font-size:11px; color:#fff;
    background:var(--accent); border:none; padding:4px 10px; border-radius:0; letter-spacing:.05em;
    margin-bottom:8px;
  }
  .field{margin:18px 0;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:7px; font-weight:600;}
  .field input[type=text], .field input[type=number], .field input[type=datetime-local], .field select, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:0;
    font-size:14.5px; background:#fff; color:var(--ink); font-family:var(--sans);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .field textarea{font-family:var(--mono); font-size:13.5px; min-height:90px; resize:vertical;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:120px;}
  .btn{
    padding:10px 18px; border-radius:0; border:1px solid var(--line); background:#fff;
    font-size:14px; font-weight:600; cursor:pointer; color:var(--ink);
  }
  .btn:hover{ background:#f4f4f3; }
  .btn.primary{background:var(--accent); color:#fff; border-color:transparent;}
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
  .btn.ghost:hover{ background:#f4f4f3; }
  .btn:active{transform:scale(0.98);}
  .output{
    margin-top:20px; padding:16px 18px; background:#fafafa; border:1px solid var(--line);
    border-radius:0; font-family:var(--mono); font-size:14px; white-space:pre-wrap; word-break:break-word;
    min-height:20px; color:var(--ink);
  }
  .output .big{font-size:26px; font-weight:700; font-family:var(--sans); color:var(--ink);}
  .hint{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5;}
  .divider{height:1px; background:var(--line); margin:22px 0;}
  .counter-display{font-family:var(--mono); font-size:52px; font-weight:600; text-align:center; padding:28px 0; color:var(--ink);}
  .segrow{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .segrow .btn{min-width:70px;}
  table.mono{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13px; color:var(--ink);}
  table.mono td, table.mono th{padding:8px 8px; border-bottom:1px solid var(--line); text-align:left;}
  .ruler-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:0; background:#fff; padding:16px 0 0;}
  .ruler{position:relative; height:70px;}
  .ruler .tick{position:absolute; bottom:0; width:1px; background:var(--ink-soft);}
  .ruler .lbl{position:absolute; bottom:22px; font-size:10px; font-family:var(--mono); transform:translateX(-50%); color:var(--muted);}
  .score-card{border:1px solid var(--line); border-radius:0; padding:18px; text-align:center; color:var(--ink);}
  .score-card input{border:none; background:transparent; text-align:center; font-weight:600; font-size:14.5px; width:100%; font-family:var(--sans); color:var(--ink);}
  .score-card .num{font-family:var(--mono); font-size:38px; font-weight:600; margin:10px 0; color:var(--ink);}
  .team-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .footer-note{text-align:center; color:var(--shell-muted); font-size:12px; margin-top:56px;}
  .empty{
    text-align:center; padding:80px 20px; color:var(--muted); font-size:14px;
  }
  ::selection{background:color-mix(in srgb, var(--accent, #2f86eb) 30%, transparent);}

  /* ---------- Search, palette, A–Z list (added in the merged build) ---------- */
  .searchbar{position:relative; margin:0 0 26px;}
  .searchbar input{width:100%; background:#121722; border:1px solid rgba(255,255,255,0.12); color:#fff;
    padding:13px 92px 13px 15px; font-family:var(--sans); font-size:14.5px; border-radius:0;}
  .searchbar input::placeholder{color:#6f7787;}
  .searchbar input:focus{outline:none; border-color:var(--accent,#2f86eb);}
  .kbdhint{position:absolute; right:12px; top:50%; transform:translateY(-50%); font-family:var(--mono);
    font-size:11px; color:#6f7787; border:1px solid rgba(255,255,255,0.12); padding:2px 6px;}
  .alist{display:flex; flex-direction:column; margin:0 0 22px;}
  .aitem{display:flex; justify-content:space-between; gap:12px; padding:8px 10px; text-decoration:none;
    color:#fff; font-size:13.5px; border-bottom:1px solid rgba(255,255,255,0.06);}
  .aitem:hover{background:rgba(255,255,255,0.06);}
  .aitem .acat{font-family:var(--mono); font-size:11.5px; opacity:0.9;}
  .palette-overlay{position:fixed; inset:0; background:rgba(5,7,11,0.72); z-index:100;
    display:flex; align-items:flex-start; justify-content:center; padding:12vh 16px 16px;}
  .palette-overlay[hidden]{display:none;}
  .palette{width:100%; max-width:620px; background:#11161f; border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 24px 60px rgba(0,0,0,0.55);}
  .palette input{width:100%; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,0.12);
    color:#fff; font-family:var(--sans); font-size:16px; padding:16px 18px;}
  .palette input:focus{outline:none;}
  .pal-list{max-height:52vh; overflow:auto;}
  .pal-item{display:flex; justify-content:space-between; gap:14px; width:100%; text-align:left;
    background:transparent; border:none; color:#e8eaee; font-family:var(--sans); font-size:14px;
    padding:11px 18px; cursor:pointer;}
  .pal-item.on{background:rgba(255,255,255,0.08);}
  .pal-item .pal-cat{font-family:var(--mono); font-size:11.5px; opacity:0.85;}
  .pal-group{font-family:var(--sans); font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:#6f7787; padding:12px 18px 6px;}
  .pal-empty{padding:18px; color:#8b93a1; font-size:13.5px;}
  .pal-foot{display:flex; gap:16px; padding:10px 18px; border-top:1px solid rgba(255,255,255,0.1);
    font-family:var(--mono); font-size:11px; color:#6f7787;}
  @media (max-width:640px){ .pal-foot{display:none;} }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  /* ---------- B1: quick wins ---------- */
  .skip{position:absolute; left:-9999px; top:8px; z-index:200; background:#fff; color:#000;
    padding:10px 14px; font-size:13px; font-weight:600; text-decoration:none;}
  .skip:focus{left:8px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .output{position:relative;}
  @media (hover:hover){
    .output:hover::after{content:"double-click to copy"; position:absolute; top:4px; right:9px;
      font-family:var(--mono); font-size:10px; color:var(--muted); opacity:.85; pointer-events:none;}
  }
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px);
    background:#11161f; color:#fff; border:1px solid rgba(255,255,255,.16); padding:10px 16px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:120;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .pal-item:focus-visible{outline:2px solid var(--accent,#2f86eb); outline-offset:-2px;}
  .crumblink{color:var(--shell-muted); text-decoration:none;}
  .crumblink:hover{color:#fff; text-decoration:underline;}
  .firstrun{margin:-14px 0 26px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .pastechip{position:absolute; z-index:60; background:#fff; border:1px solid var(--line-strong);
    color:var(--ink-soft); font-family:var(--sans); font-size:11.5px; font-weight:600;
    padding:4px 9px; cursor:pointer;}
  .pastechip:hover{background:#f4f4f3;}
  .chip{font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    border:1px solid #c0392b; color:#c0392b; padding:2px 6px; margin-left:6px; vertical-align:2px;}
  .newchip{font-family:var(--mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase;
    border:1px solid currentColor; padding:1px 4px; margin-left:6px; opacity:.8; vertical-align:1px;}
  /* There are no translucent surfaces in this app, so there is nothing for
     prefers-reduced-transparency to reduce. Recorded rather than ignored. */
  @media (prefers-contrast: more){
    :root{--shell-muted:#e3e7ee; --muted:#5b5b63;}
    .hint{color:#2f2f35;}
    .tag .code{opacity:1;}
    .output{background:#fff; border-color:#b9b9b5;}
  }
  @media print{
    .topbar,.searchbar,.firstrun,.footer-note,.palette-overlay,.kbdhint,#pinBtn,.skip,.toast{display:none !important;}
    body{background:#fff; color:#000;}
    .wrap{max-width:none; padding:0;}
    .panel{border:none; padding:0;}
    .panel h2,.panel .code-pill,.hero h1,.hero p{color:#000 !important;}
    .output{background:#fff; border:1px solid #ccc; color:#000;}
    a{color:#000; text-decoration:underline;}
  }
</style>
</head>
<body>
<a class="skip" href="#app">Skip to the tools</a>
<noscript>
  <div style="max-width:560px; margin:64px auto; padding:0 22px; color:#fff; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <h1 style="font-size:24px; margin:0 0 12px">Kitbox needs JavaScript</h1>
    <p style="color:#a7adb9; line-height:1.7; margin:0">Every tool in this file runs in your browser — there is no server to fall back on, which is exactly why nothing you open here can be uploaded anywhere. Turn JavaScript on for this page and reload.</p>
  </div>
</noscript>
<header class="topbar">
  <button class="backbtn hidden" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <div class="brand"><span class="dot" id="brandDot"></span>Kitbox</div>
  <div class="crumb" id="crumb"></div>
  <nav aria-label="App pages" style="display:flex;gap:0;margin-left:auto">
  <button class="backbtn" id="supportBtn" aria-label="Support Kitbox" style="color:#C2185B">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.6 2.9 5 6.5 5c2 0 3.3 1 5.5 3 2.2-2 3.5-3 5.5-3 3.6 0 5.8 3.6 4 7.5C19 16.65 12 21 12 21z"/></svg>
  </button>
  <button class="backbtn" id="aboutBtn" aria-label="About Kitbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
  </button>
  </nav>
</header>
<main class="wrap" id="app"></main>

<script>
/* ============================================================
   TOOLY — offline toolbox. Single-file, zero dependencies.
   ============================================================ */

/* ---------- Category registry ---------- */
const CATS = [
  {id:'general',   code:'GEN', name:'General Tools',      color:'#C2185B', desc:'A number of different tools that can be used for a variety of purposes.', icon:'toolbox'},
  {id:'text',      code:'TXT', name:'Text Tools',          color:'#E6A400', desc:'More than thirty beneficial features that help you edit your text content.', icon:'text'},

  {id:'dev',       code:'DEV', name:'Development Tools',   color:'#12A99A', desc:'Create an organized page for your codes using development tools.', icon:'dev'},

  {id:'science',   code:'SCI', name:'Science Tools',       color:'#7B4FE0', desc:'Physics, chemistry, and lab-relevant calculators.', icon:'science'},
  {id:'geo',       code:'GEO', name:'Geo Tools',           color:'#0E9F6E', desc:'Coordinates, distance, bearing, and sun position tools.', icon:'geo'},
  {id:'audio',     code:'AUD', name:'Audio Tools',         color:'#D6336C', desc:'Tone generator, metronome, noise, and audio utilities — powered by your device speaker and microphone.', icon:'audio'},
  {id:'games',     code:'GAM', name:'Games',               color:'#F59F00', desc:'Quick offline games and brain teasers.', icon:'games'},
  {id:'travel',    code:'TRV', name:'Travel Tools',        color:'#1971C2', desc:'Packing lists, flight duration, and travel reference tools.', icon:'travel'},
  {id:'nature',    code:'NAT', name:'Nature Tools',        color:'#2F9E44', desc:'Moon phase, solstices, and sky-related estimators.', icon:'nature'},

  {id:'files',     code:'FIL', name:'Files & Data',        color:'#3B5BDB', desc:'ZIP, gzip, hashing, encryption and metadata — your files stay on your device.', icon:'files'},
  {id:'almanac',   code:'ALM', name:'Almanac',              color:'#C2410C', desc:'Panchang, rahu kaal, sunrise and moon timings, computed from the Meeus series.', icon:'almanac'},
  {id:'comms',     code:'COM', name:'Communication',        color:'#0B7285', desc:'Contact cards, calendar invites and message links you can hand to any app.', icon:'comms'},
  {id:'reference', code:'REF', name:'Reference',            color:'#5F3DC4', desc:'Cheat sheets and tables you keep open beside the tool you are using.', icon:'reference'},
  {id:'system',    code:'SYS', name:'System',               color:'#343A40', desc:'What this browser and this device can actually do.', icon:'system'},
];

const ICONS = {
  toolbox:'<path d="M3 8h18v11H3z"/><path d="M3 12h18"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  text:'<path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h7"/>',
  gen:'<rect x="4" y="4" width="16" height="4"/><path d="M4 12h16M4 16h10M4 20h6"/>',
  calc:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-4 4-3-3-6 6"/>',
  unit:'<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
  finance:'<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',

/* Pick the text colour that actually passes on a tile, from the colour itself
   rather than by eye: 14 of the original 23 tiles failed WCAG AA with white
   text (white on #22D9D9 is 1.75:1 against a 4.5:1 threshold). */
function tileLuminance(hex){
  const h = String(hex||'#ffffff').replace('#','');
  const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
  const ch = [0,2,4].map(i=>parseInt(full.slice(i,i+2),16)/255)
    .map(c=> c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4));
  return 0.2126*ch[0] + 0.7152*ch[1] + 0.0722*ch[2];
}
function contrastWith(a, b){
  const la = tileLuminance(a), lb = tileLuminance(b);
  return (Math.max(la,lb) + 0.05) / (Math.min(la,lb) + 0.05);
}
const TILE_INK_DARK = '#17171d', TILE_INK_LIGHT = '#ffffff';
function inkFor(hex){
  return contrastWith(hex, TILE_INK_LIGHT) >= contrastWith(hex, TILE_INK_DARK) ? TILE_INK_LIGHT : TILE_INK_DARK;
}

/* One write path, so a full disk is reported instead of swallowed. */
let quotaWarned = false;
const store = {
  get(k, d){ try{ const v = localStorage.getItem('tooly:'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){
    try{
      localStorage.setItem('tooly:'+k, JSON.stringify(v));
      return true;
    }catch(e){
      const full = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
      if(!quotaWarned){
        quotaWarned = true;
        try{
          toast(full
            ? 'This device\u2019s storage is full — that last change was not saved. Productivity \u2192 Backup & Restore shows what is using the space.'
            : 'That change could not be saved (storage blocked by the browser).');
        }catch(err){}
        try{ logError('storage', e); }catch(err){}
      }
      return false;
    }
  },
  remove(k){ try{ localStorage.removeItem('tooly:'+k); return true; }catch(e){ return false; } },
  allKeys(){ try{ return Object.keys(localStorage).filter(k=>k.startsWith('tooly:')).map(k=>k.slice(6)); }catch(e){ return []; } },
  bytes(k){ try{ return (localStorage.getItem('tooly:'+k)||'').length; }catch(e){ return 0; } }
};

/* Schema migrations. Each step runs once, in order, and the version is only
   written after it succeeds — a half-migrated store is worse than an old one. */
const MIGRATIONS = {
  1: ()=>{ /* versioning arrived after the data; existing keys are already v1 */ },
  2: ()=>{
    const habits = store.get('habits-list', null);
    if(Array.isArray(habits)) store.set('habits-list', habits.map(h=>({name:h && h.name || 'Habit', log:Array.isArray(h && h.log) ? h.log : []})));
    const decks = store.get('flashcard-decks', null);
    if(Array.isArray(decks)) store.set('flashcard-decks', decks.map((d,i)=>({
      id: d && d.id || 'deck-' + i,
      name: d && d.name || 'Deck ' + (i+1),
      cards: Array.isArray(d && d.cards) ? d.cards.filter(c=>c && (c.front || c.back)) : []
    })));
  }
};

function migrateStore(){
  let at = Number(store.get('schema', 0)) || 0;
  if(at >= STORE_SCHEMA) return at;
  for(let v = at + 1; v <= STORE_SCHEMA; v++){
    try{
      if(MIGRATIONS[v]) MIGRATIONS[v]();
      store.set('schema', v);
      at = v;
    }catch(e){
      logError('migration ' + v, e);
      break;
    }
  }
  return at;
}

/* -- Export / Import helpers, reused by any tool that persists data -- */
function downloadJSON(data, filename){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
function readJSONFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{ try{ resolve(JSON.parse(reader.result)); }catch(e){ reject(e); } };
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

/* -- Tool lifecycle cleanup --
   Any tool that starts a timer, camera stream, microphone stream, geolocation watch, or
   audio node MUST call setCleanup(fn) once during render() with a function that stops it.
   The router calls runCleanup() before every navigation (including tab close), so leaving
   a tool always stops whatever it started — no lingering intervals, mics, cameras, or GPS. */
let currentCleanup = null;
function setCleanup(fn){ currentCleanup = fn; }
function runCleanup(){ if(currentCleanup){ try{ currentCleanup(); }catch(e){} currentCleanup = null; } }

/* Escapes text for safe insertion into innerHTML. Use for ANY user-typed or imported string
   (note titles/bodies, deck/card text, team/habit names, decoded JWT/QR content, etc.) before
   interpolating it into a template literal that gets assigned to innerHTML. */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

/* A transient message at the bottom of the screen. */
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('kToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'kToast'; el.className = 'toast';
    el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), 1500);
}

/* A paste button appears over an empty text field, because the clipboard is
   the most common way text arrives and on a phone the long-press menu is a
   lottery. Delegated, so it works in every tool and survives re-renders. */
let pasteChip = null;
function hidePasteChip(){
  if(pasteChip && pasteChip.parentNode) pasteChip.parentNode.removeChild(pasteChip);
  pasteChip = null;
}
document.addEventListener('focusin', e=>{
  hidePasteChip();
  const el = e.target;
  if(!el || (el.tagName !== 'TEXTAREA' && !(el.tagName === 'INPUT' && el.type === 'text'))) return;
  if(el.value || !(navigator.clipboard && navigator.clipboard.readText)) return;
  if(el.closest('[hidden]')) return;
  const rect = el.getBoundingClientRect();
  pasteChip = document.createElement('button');
  pasteChip.type = 'button';
  pasteChip.className = 'pastechip';
  pasteChip.textContent = 'Paste';
  pasteChip.style.top = (window.scrollY + rect.top + 4) + 'px';
  pasteChip.style.left = (window.scrollX + rect.right - 62) + 'px';
  pasteChip.addEventListener('mousedown', ev=>ev.preventDefault());
  pasteChip.addEventListener('click', async ()=>{
    try{
      const text = await navigator.clipboard.readText();
      el.value = text;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      toast('Pasted');
    }catch(err){ toast('The browser would not let Kitbox read the clipboard'); }
    hidePasteChip();
    el.focus();
  });
  document.body.appendChild(pasteChip);
});
document.addEventListener('focusout', ()=>setTimeout(hidePasteChip, 150));

/* Double-click any result block to copy it. Delegated on the document, so it
   survives the re-render most tools do on every keystroke — attaching a button
   to each .output would vanish the moment the tool redrew itself. */
document.addEventListener('dblclick', e=>{
  const target = e.target && e.target.closest ? e.target : null;
  // A table is copied as CSV, not as the text it happens to display.
  const table = target ? target.closest('table') : null;
  if(table && table.rows.length > 1 && !table.closest('.palette-overlay')){
    const csv = Array.from(table.rows).map(r=>Array.from(r.cells)
      .map(c=>'"' + c.textContent.trim().replace(/"/g, '""') + '"').join(',')).join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(csv).then(()=>toast('Table copied as CSV'), ()=>toast('Could not copy'));
    }
    return;
  }
  const box = target ? target.closest('.output') : null;
  if(!box) return;
  if(box.querySelector('input,textarea,select,button')) return;
  const text = (box.innerText || box.textContent || '').trim();
  if(!text || text === '—') return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Copied'), ()=>toast('Could not copy — select the text instead'));
  } else {
    toast('Copy is not available in this browser');
  }
});

/* How numbers are grouped. Indian grouping is 1,00,000; international is
   100,000. One preference, read at format time, so a tool cannot disagree. */
function numLocale(){ return store.get('num-format', 'in') === 'us' ? 'en-US' : 'en-IN'; }
function prefUnits(){ return store.get('units', 'metric') === 'imperial' ? 'imperial' : 'metric'; }

/* Web Crypto needs a secure context. One place decides that, so no tool has to
   remember the rule and none of them can disagree about it. */
function cryptoAvailable(){
  try{ return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.digest); }
  catch(e){ return false; }
}
const CRYPTO_MSG = 'This needs Web Crypto, which browsers only expose on https or localhost. Serve the file (python3 -m http.server) or open it from the published page.';

/* A failed file read should say what to do about it, not just "error". */
function readFileSafely(file){
  return readFileBytes(file).catch(err=>{
    const name = (file && file.name) || 'that file';
    throw new Error('The browser could not read "' + name + '". It may have moved, or been blocked — choose it again. (' + ((err && err.message) || err) + ')');
  });
}

/* Files are read whole into memory, so there is a ceiling. Better a sentence
   than a frozen tab. */
const MAX_FILE_MB = 200;
function fileTooBig(file, mb){
  return !!file && file.size > (mb || MAX_FILE_MB) * 1048576;
}
function fileTooBigMsg(file, mb){
  return 'That file is ' + fmtBytes(file.size) + '. Kitbox reads the whole file into memory, so it stops at '
    + (mb || MAX_FILE_MB) + ' MB — split it first, or use a tool built for files that size.';
}

/* Rough passphrase strength: length times the size of the character pool,
   with the obvious passphrases scored zero regardless of length. */
function passStrength(p){
  if(!p) return {score:0, label:'', bits:0};
  let classes = 0;
  if(/[a-z]/.test(p)) classes++;
  if(/[A-Z]/.test(p)) classes++;
  if(/\d/.test(p)) classes++;
  if(/[^A-Za-z0-9]/.test(p)) classes++;
  const common = /^(password|passphrase|letmein|qwerty|123456|admin|welcome|iloveyou)/i.test(p);
  const bits = Math.round(p.length * Math.log2(Math.max(2, classes * 26)));
  const score = common ? 0 : bits < 40 ? 1 : bits < 60 ? 2 : bits < 80 ? 3 : 4;
  const label = common ? 'too common — pick something else' : ['', 'weak', 'fair', 'good', 'strong'][score];
  return {score, label, bits};
}

/* YYYY-MM-DD in the user's LOCAL timezone (not UTC — Date#toISOString is UTC and can land on
   the wrong calendar day for anyone not in UTC+0, especially near midnight). Used anywhere a
   tool needs to compare "today" against a stored date, e.g. habit streaks and flashcard due dates. */
function localDateStr(d){
  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* Renders a standard "Export / Import" row into `container` for a given store key.
   onImport(data) is called after a successful import so the caller can re-render. */
function exportImportRow(container, key, filename, onImport){
  container.innerHTML = `
    <div class="segrow">
      <button class="btn" data-exp>⬇ Export data</button>
      <label class="btn" style="cursor:pointer">⬆ Import data<input type="file" accept="application/json" data-imp style="display:none"></label>
    </div>
    <div class="hint" data-impmsg style="display:none"></div>`;
  container.querySelector('[data-exp]').addEventListener('click', ()=>{
    downloadJSON(store.get(key, null), filename);
  });
  container.querySelector('[data-imp]').addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const msg = container.querySelector('[data-impmsg]');
    try{
      const data = await readJSONFile(file);
      store.set(key, data);
      msg.style.display='block'; msg.textContent = 'Imported successfully.';
      onImport && onImport(data);
    }catch(err){ msg.style.display='block'; msg.textContent = 'That file was not valid — import cancelled.'; }
  });
}

TOOLS.general.push({id:'ruler', code:'GEN-01', name:'Ruler', render(root){
  const saved = store.get('ruler-scale', 37.8); // px per cm baseline guess
  root.innerHTML = `
    <div class="field">
      <label>Calibrate — adjust until the bar below matches a real 8.56 cm card (e.g. a bank card) held to your screen</label>
      <input type="range" id="cal" min="20" max="60" step="0.1" value="${saved}">
      <div class="hint">Current scale: <span id="calVal">${saved}</span> px/cm</div>
    </div>
    <div class="ruler-wrap"><div class="ruler" id="rulerBox"></div></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="unitCm">Show cm</button>
      <button class="btn" id="unitIn">Show inches</button>
    </div>
  `;
  let unit = 'cm';
  const box = root.querySelector('#rulerBox');
  const cal = root.querySelector('#cal');
  const calVal = root.querySelector('#calVal');
  function draw(){
    const pxPerCm = parseFloat(cal.value);
    box.innerHTML='';
    const totalCm = 22;
    const width = unit==='cm' ? pxPerCm*totalCm : pxPerCm*2.54*Math.floor(totalCm/2.54);
    box.style.width = width+'px';
    if(unit==='cm'){
      for(let mm=0; mm<=totalCm*10; mm+=1){
        const cm = mm/10;
        const x = cm*pxPerCm;
        const isCm = mm%10===0, isHalf = mm%5===0;
        const t=document.createElement('div');
        t.className='tick';
        t.style.left=x+'px';
        t.style.height = isCm? '28px' : (isHalf? '18px':'10px');
        box.appendChild(t);
        if(isCm){ const l=document.createElement('div'); l.className='lbl'; l.style.left=x+'px'; l.textContent=cm; box.appendChild(l); }
      }
    } else {
      const pxPerIn = pxPerCm*2.54;
      const totalIn = Math.floor(totalCm/2.54);
      for(let i8=0;i8<=totalIn*8;i8++){
        const inch = i8/8;
        const x = inch*pxPerIn;
        const isIn = i8%8===0, isHalf=i8%4===0, isQuarter=i8%2===0;
        const t=document.createElement('div');
        t.className='tick'; t.style.left=x+'px';
        t.style.height = isIn?'28px':(isHalf?'20px':(isQuarter?'14px':'8px'));
        box.appendChild(t);
        if(isIn){ const l=document.createElement('div'); l.className='lbl'; l.style.left=x+'px'; l.textContent=inch; box.appendChild(l);}
      }
    }
  }
  cal.addEventListener('input', ()=>{ calVal.textContent=cal.value; store.set('ruler-scale', parseFloat(cal.value)); draw(); });
  root.querySelector('#unitCm').addEventListener('click', ()=>{unit='cm'; draw();});
  root.querySelector('#unitIn').addEventListener('click', ()=>{unit='in'; draw();});
  draw();
}});

/* 7. Roman Numerals */
function toRoman(num){
  if(!num || num<=0 || num>3999) return '—';
  const vals=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let res='', n=num;
  for(const [v,s] of vals){ while(n>=v){res+=s; n-=v;} }
  return res;
}
function fromRoman(str){
  const map={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
  str=str.toUpperCase().trim();
  if(!/^[IVXLCDM]+$/.test(str)) return null;
  let total=0;
  for(let i=0;i<str.length;i++){
    const cur=map[str[i]], next=map[str[i+1]];
    if(next>cur) total-=cur; else total+=cur;
  }
  return total;
}

/* 8. Number To Word */
const ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function threeDigits(n){
  let s='';
  if(n>=100){ s+=ONES[Math.floor(n/100)]+' hundred '; n%=100; }
  if(n>=20){ s+=TENS[Math.floor(n/10)]+' '; n%=10; }
  if(n>0) s+=ONES[n]+' ';
  return s;
}
function numberToWords(num){
  if(num===0) return 'zero';
  if(num<0) return 'negative '+numberToWords(-num);
  const scales=['','thousand','million','billion','trillion'];
  let groups=[]; let n=Math.floor(num);
  if(n===0) groups=[0];
  while(n>0){ groups.push(n%1000); n=Math.floor(n/1000); }
  let words='';
  for(let i=groups.length-1;i>=0;i--){
    if(groups[i]>0){ words += threeDigits(groups[i]) + scales[i] + ' '; }
  }
  return words.trim().replace(/\s+/g,' ');
}

/* 11. Timezone Converter */
function getTzOffsetMs(timeZone, date){
  const dtf = new Intl.DateTimeFormat('en-US', {timeZone, hour12:false, year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const parts = dtf.formatToParts(date).reduce((acc,p)=>{ if(p.type!=='literal') acc[p.type]=p.value; return acc; },{});
  const hour = parts.hour==='24' ? '00' : parts.hour;
  const asUTC = Date.UTC(+parts.year, +parts.month-1, +parts.day, +hour, +parts.minute, +parts.second);
  return asUTC - date.getTime();
}
function convertBetweenZones(dateTimeLocalStr, fromTz, toTz){
  const guess = new Date(dateTimeLocalStr+':00Z');
  const offsetFrom = getTzOffsetMs(fromTz, guess);
  const actualInstant = new Date(guess.getTime() - offsetFrom);
  return new Intl.DateTimeFormat('en-US', {timeZone:toTz, dateStyle:'medium', timeStyle:'long'}).format(actualInstant);
}
let TZ_LIST=null;
function getTzList(){
  if(TZ_LIST) return TZ_LIST;
  try{ TZ_LIST = Intl.supportedValuesOf('timeZone'); }catch(e){
    TZ_LIST = ['UTC','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Sao_Paulo','Europe/London','Europe/Paris','Europe/Berlin','Europe/Moscow','Africa/Cairo','Asia/Dubai','Asia/Kolkata','Asia/Kathmandu','Asia/Dhaka','Asia/Bangkok','Asia/Shanghai','Asia/Tokyo','Asia/Seoul','Australia/Sydney','Pacific/Auckland'];
  }
  return TZ_LIST;
}
TOOLS.general.push({id:'tzconv', code:'GEN-11', name:'Timezone Converter', render(root){
  const zones = getTzList();
  const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  // 400+ <option> elements cost 80 ms to build — a fifth of the whole app's
  // render time, for a list nobody scrolls. A filter plus the first 80 matches
  // is faster to open and faster to use.
  function optionsFor(query, selected){
    const q = (query || '').toLowerCase();
    const hits = q ? zones.filter(z=>z.toLowerCase().includes(q)) : zones;
    const list = hits.slice(0, 80);
    // Whatever is currently chosen stays in the list, even if the cap or the
    // filter would have dropped it — otherwise the select silently empties and
    // the converter loses its timezone.
    if(selected && !list.includes(selected)) list.unshift(selected);
    if(!list.length && selected) list.push(selected);
    return list.map(z=>`<option value="${z}"${z === selected ? ' selected' : ''}>${z}</option>`).join('');
  }
  root.innerHTML = `
    <div class="field"><label>Date & time</label><input type="datetime-local" id="tzDate"></div>
    <div class="row">
      <div class="field"><label>Filter zones</label><input type="text" id="tzFilter" placeholder="asia, europe/london…" autocomplete="off"></div>
    </div>
    <div class="row">
      <div class="field"><label>From timezone</label><select id="tzFrom">${optionsFor('', localTz)}</select></div>
      <div class="field"><label>To timezone</label><select id="tzTo">${optionsFor('', 'Asia/Tokyo')}</select></div>
    </div>
    <div class="output" id="tzOut">Pick a date/time and two timezones.</div>
  `;
  root.querySelector('#tzFilter').addEventListener('input', e=>{
    const q = e.target.value;
    const keepFrom = root.querySelector('#tzFrom').value, keepTo = root.querySelector('#tzTo').value;
    root.querySelector('#tzFrom').innerHTML = optionsFor(q, keepFrom);
    root.querySelector('#tzTo').innerHTML = optionsFor(q, keepTo);
    root.querySelector('#tzFrom').dispatchEvent(new Event('input', { bubbles: true }));
  });
  const dateEl = root.querySelector('#tzDate');
  const from = root.querySelector('#tzFrom'), to = root.querySelector('#tzTo');
  const now = new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  dateEl.value = now.toISOString().slice(0,16);
  to.value = zones.includes('Asia/Tokyo') ? 'Asia/Tokyo' : zones[0];
  function update(){
    if(!dateEl.value) return;
    root.querySelector('#tzOut').textContent = convertBetweenZones(dateEl.value, from.value, to.value);
  }
  [dateEl,from,to].forEach(el=>el.addEventListener('input', update));
  update();
}});

  function toSnake(s){ return s.trim().replace(/\W+/g,' ').trim().split(/\s+/).join('_').toLowerCase(); }
  function toKebab(s){ return s.trim().replace(/\W+/g,' ').trim().split(/\s+/).join('-').toLowerCase(); }
  function toAlt(s){ return s.split('').map((c,i)=> i%2? c.toLowerCase() : c.toUpperCase()).join(''); }
  root.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click', ()=>{
    const s = inp.value; const t = b.dataset.case;
    out.textContent = ({
      'UPPERCASE': s.toUpperCase(), 'lowercase': s.toLowerCase(), 'Title Case': toTitle(s),
      'Sentence case': toSentence(s), 'camelCase': toCamel(s), 'PascalCase': toPascal(s),
      'snake_case': toSnake(s), 'kebab-case': toKebab(s), 'aLtErNaTiNg': toAlt(s)
    })[t] || '';
  }));
});

/* -- Stylish Tools -- */
const UNI_STYLES = {
  'Bold': mapUnicode(0x1D400,0x1D41A,0x1D7CE),
  'Italic': mapUnicode(0x1D434,0x1D44E,null,{'h':'\u210E'}),
  'Bold Italic': mapUnicode(0x1D468,0x1D482,null),
  'Script': mapUnicode(0x1D49C,0x1D4B6,null,{},{B:'\u212C',E:'\u2130',F:'\u2131',H:'\u210B',I:'\u2110',L:'\u2112',M:'\u2133',R:'\u211B',e:'\u212F',g:'\u210A',o:'\u2134'}),
  'Double-Struck': mapUnicode(0x1D538,0x1D552,0x1D7D8,{},{C:'\u2102',H:'\u210D',N:'\u2115',P:'\u2119',Q:'\u211A',R:'\u211D',Z:'\u2124'}),
  'Monospace': mapUnicode(0x1D670,0x1D68A,0x1D7F6),
  'Sans Bold': mapUnicode(0x1D5D4,0x1D5EE,0x1D7EC),
  'Circled': mapUnicode(0x24B6,0x24D0,null,{},{},'circled'),
  'Fullwidth': mapUnicode(null,null,null,{},{},'fullwidth'),
};
function mapUnicode(upBase, lowBase, digBase, exSpecific, exMap, special){
  return function(ch){
    if(special==='circled'){
      if(/[A-Z]/.test(ch)) return String.fromCodePoint(0x24B6 + ch.charCodeAt(0)-65);
      if(/[a-z]/.test(ch)) return String.fromCodePoint(0x24D0 + ch.charCodeAt(0)-97);
      if(ch==='0') return '\u24EA';
      if(/[1-9]/.test(ch)) return String.fromCodePoint(0x2460 + ch.charCodeAt(0)-49);
      return ch;
    }
    if(special==='fullwidth'){
      if(ch===' ') return '\u3000';
      const c = ch.charCodeAt(0);
      if(c>=0x21 && c<=0x7E) return String.fromCodePoint(c+0xFEE0);
      return ch;
    }
    if(exMap && exMap[ch]) return exMap[ch];
    if(/[A-Z]/.test(ch) && upBase!==null) return String.fromCodePoint(upBase + ch.charCodeAt(0)-65);
    if(/[a-z]/.test(ch) && lowBase!==null) return String.fromCodePoint(lowBase + ch.charCodeAt(0)-97);
    if(/[0-9]/.test(ch) && digBase!==null) return String.fromCodePoint(digBase + ch.charCodeAt(0)-48);
    return ch;
  };
}

    <div class="output" id="caOut">Result will appear here.</div>`;

/* Standalone QR encoder — versions 1-40, byte mode, EC levels L/M/Q/H. No dependencies. */
const QR = (function(){

  const EXP = new Array(512), LOG = new Array(256);
  (function(){
    let x = 1;
    for(let i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x <<= 1; if(x & 0x100) x ^= 0x11D; }
    for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
  })();
  function gfMul(a,b){ if(a===0||b===0) return 0; return EXP[LOG[a]+LOG[b]]; }

  function genPoly(ecLen){
    let poly = [1];
    for(let i=0;i<ecLen;i++){
      const next = new Array(poly.length+1).fill(0);
      for(let j=0;j<poly.length;j++){
        next[j] ^= gfMul(poly[j], 1); // placeholder, real mult below
      }
      poly = polyMulMonomial(poly, EXP[i]);
    }
    return poly;
  }
  // multiply poly by (x - EXP[i]) i.e. (x + EXP[i]) in GF2 arithmetic
  function polyMulMonomial(poly, root){
    const result = new Array(poly.length+1).fill(0);
    for(let i=0;i<poly.length;i++){
      result[i] ^= poly[i];
      if(poly[i]!==0) result[i+1] ^= gfMul(poly[i], root);
    }

  function bchVersion(v6){
    let d = v6 << 12;
    const gen = 0b1111100100101;
    for(let i=5;i>=0;i--){ if(d & (1<<(i+12))) d ^= gen << i; }
    return (v6<<12) | d;
  }

  function chooseVersion(byteLen, level){
    for(let v=1; v<=40; v++){
      const cb = charCountBits(v,'byte');
      const headerBits = 4 + cb;
      const totalBits = headerBits + 8*byteLen;
      const r = RS[v-1][level];
      const capacityCodewords = r[1]*r[2] + r[3]*r[4];
      if(totalBits <= capacityCodewords*8) return v;
    }
    return null; // too big
  }

  function buildDataCodewords(bytes, version, level){
    const cb = charCountBits(version,'byte');
    const r = RS[version-1][level];
    const capacityBytes = r[1]*r[2] + r[3]*r[4];
    let bits = [];
    function push(val, len){ for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); }
    push(0b0100, 4);
    push(bytes.length, cb);
    bytes.forEach(b=>push(b,8));
    // terminator
    const remain = capacityBytes*8 - bits.length;
    push(0, Math.min(4, Math.max(0,remain)));
    while(bits.length % 8 !== 0) bits.push(0);
    let codewords = [];
    for(let i=0;i<bits.length;i+=8){
      let v=0; for(let j=0;j<8;j++) v=(v<<1)|bits[i+j];
      codewords.push(v);
    }
    const pad = [0xEC,0x11];
    let pi=0;
    while(codewords.length < capacityBytes){ codewords.push(pad[pi%2]); pi++; }
    return codewords;
  }

  function interleave(dataCodewords, version, level){
    const r = RS[version-1][level];
    const [ec,b1,dc1,b2,dc2] = r;
    const blocks = [];
    let idx=0;
    for(let i=0;i<b1;i++){ blocks.push(dataCodewords.slice(idx, idx+dc1)); idx+=dc1; }
    for(let i=0;i<b2;i++){ blocks.push(dataCodewords.slice(idx, idx+dc2)); idx+=dc2; }
    const ecBlocks = blocks.map(bl=>rsEncode(bl.slice(), ec));
    const maxData = Math.max(dc1, b2?dc2:0);
    let dataOut = [];
    for(let i=0;i<maxData;i++){
      blocks.forEach(bl=>{ if(i<bl.length) dataOut.push(bl[i]); });
    }
    let ecOut = [];
    for(let i=0;i<ec;i++){
      ecBlocks.forEach(bl=>{ ecOut.push(bl[i]); });
    }
    const allBytes = dataOut.concat(ecOut);
    let bits=[];
    allBytes.forEach(b=>{ for(let i=7;i>=0;i--) bits.push((b>>i)&1); });
    for(let i=0;i<REMAINDER[version];i++) bits.push(0);
    return bits;
  }

  function encode(text, level){
    level = level || 'M';
    const bytes = Array.from(new TextEncoder().encode(text));
    const version = chooseVersion(bytes.length, level);
    if(!version) throw new Error('Data too long for QR code (max ~2900 bytes at L level).');
    const dataCodewords = buildDataCodewords(bytes, version, level);
    const finalBits = interleave(dataCodewords, version, level);
    const size = version*4 + 17;
    const matrix = Array.from({length:size},()=>new Array(size).fill(null));
    const reserved = Array.from({length:size},()=>new Array(size).fill(false));

    function setModule(r,c,val,res){ if(r<0||c<0||r>=size||c>=size) return; matrix[r][c]=val; if(res) reserved[r][c]=true; }
    function placeFinder(r,c){
      for(let i=-1;i<=7;i++) for(let j=-1;j<=7;j++){
        const rr=r+i, cc=c+j;
        if(rr<0||cc<0||rr>=size||cc>=size) continue;
        let dark;
        if(i>=0&&i<=6&&j>=0&&j<=6){
          dark = (i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4));
        } else dark=false; // separator
        setModule(rr,cc,dark,true);
      }
    }
    placeFinder(0,0); placeFinder(0,size-7); placeFinder(size-7,0);
    // timing patterns
    for(let i=8;i<size-8;i++){ setModule(6,i, i%2===0, true); setModule(i,6, i%2===0, true); }
    // alignment patterns
    const aps = ALIGN[version];
    if(aps && aps.length){
      aps.forEach(r=>aps.forEach(c=>{
        // skip if overlapping finder corners
        if((r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8)) return;
        for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++){
          const dark = (i===-2||i===2||j===-2||j===2||(i===0&&j===0));
          setModule(r+i,c+j,dark,true);
        }
      }));
    }
    // dark module
    setModule(size-8,8,true,true);
    // format info reserved areas
    for(let i=0;i<9;i++){ setModule(8,i,false,true); setModule(i,8,false,true); }
    for(let i=0;i<8;i++){ setModule(8,size-1-i,false,true); setModule(size-1-i,8,false,true); }
    setModule(8,8,false,true);
    // version info reserved areas
    if(version>=7){
      for(let i=0;i<6;i++) for(let j=0;j<3;j++){ setModule(size-11+j,i,false,true); setModule(i,size-11+j,false,true); }
    }

    // place data bits in zig-zag
    let bitIdx=0;
    let dir=-1; let col=size-1;
    while(col>0){
      if(col===6) col--;
      for(let rowStep=0; rowStep<size; rowStep++){
        const row = dir===-1 ? size-1-rowStep : rowStep;
        for(let k=0;k<2;k++){
          const c = col-k;
          if(!reserved[row][c]){
            const bit = bitIdx<finalBits.length ? finalBits[bitIdx] : 0;
            matrix[row][c] = !!bit;
            bitIdx++;
          }
        }
      }
      dir = -dir;
      col -= 2;
    }

    // masking: try all 8, pick lowest penalty
    const maskFns = [
      (r,c)=> (r+c)%2===0,
      (r,c)=> r%2===0,
      (r,c)=> c%3===0,
      (r,c)=> (r+c)%3===0,
      (r,c)=> (Math.floor(r/2)+Math.floor(c/3))%2===0,
      (r,c)=> ((r*c)%2 + (r*c)%3)===0,
      (r,c)=> (((r*c)%2 + (r*c)%3)%2)===0,
      (r,c)=> (((r+c)%2 + (r*c)%3)%2)===0
    ];
    function applyMask(mi){
      const m2 = matrix.map((row,r)=>row.map((v,c)=> reserved[r][c]? v : (v !== maskFns[mi](r,c))));
      return m2;
    }
    function penalty(m2){
      let p=0;
      // rule1 rows+cols
      for(let r=0;r<size;r++){
        let run=1;
        for(let c=1;c<size;c++){
          if(m2[r][c]===m2[r][c-1]) run++; else { if(run>=5) p+=3+(run-5); run=1; }
        }
        if(run>=5) p+=3+(run-5);
      }
      for(let c=0;c<size;c++){
        let run=1;
        for(let r=1;r<size;r++){
          if(m2[r][c]===m2[r-1][c]) run++; else { if(run>=5) p+=3+(run-5); run=1; }
        }
        if(run>=5) p+=3+(run-5);
      }
      // rule2 2x2 blocks
      for(let r=0;r<size-1;r++) for(let c=0;c<size-1;c++){
        const v=m2[r][c];
        if(v===m2[r][c+1] && v===m2[r+1][c] && v===m2[r+1][c+1]) p+=3;
      }
      // rule3 finder-like pattern
      const pat1=[true,false,true,true,true,false,true,false,false,false,false];
      const pat2=[false,false,false,false,true,false,true,true,true,false,true];
      function matchAt(arr,i,pat){ for(let k=0;k<pat.length;k++) if(arr[i+k]!==pat[k]) return false; return true; }
      for(let r=0;r<size;r++){
        for(let c=0;c<=size-11;c++){
          const row=m2[r].slice(c,c+11);
          if(matchAt(row,0,pat1)||matchAt(row,0,pat2)) p+=40;
        }
      }
      for(let c=0;c<size;c++){
        const colArr = m2.map(row=>row[c]);
        for(let r=0;r<=size-11;r++){
          const seg = colArr.slice(r,r+11);
          if(matchAt(seg,0,pat1)||matchAt(seg,0,pat2)) p+=40;
        }
      }
      // rule4 dark ratio
      let dark=0;
      m2.forEach(row=>row.forEach(v=>{ if(v) dark++; }));
      const pct = dark*100/(size*size);
      const prevMult = Math.floor(Math.abs(pct-50)/5);
      p += prevMult*10;
      return p;
    }
    let best=null, bestScore=Infinity, bestMask=0;
    for(let mi=0;mi<8;mi++){
      const m2 = applyMask(mi);
      const sc = penalty(m2);
      if(sc<bestScore){ bestScore=sc; best=m2; bestMask=mi; }
    }
    // write format info
    const fmtVal = bchFormat((EC_BITS[level]<<3)|bestMask);
    function fmtBit(i){ return ((fmtVal>>i)&1)===1; }
    // 15 bits, i=14..0
    const fmtOrderA = [ [8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8] ];
    for(let i=0;i<15;i++){ const [r,c]=fmtOrderA[i]; best[r][c]=fmtBit(14-i); }
    const fmtOrderB = [ [size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],[8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1] ];
    for(let i=0;i<15;i++){ const [r,c]=fmtOrderB[i]; best[r][c]=fmtBit(14-i); }
    // version info
    if(version>=7){
      const verVal = bchVersion(version);
      function vBit(i){ return ((verVal>>i)&1)===1; }
      let bit=0;
      for(let r=0;r<6;r++) for(let c=0;c<3;c++){ best[r][size-11+c]=vBit(bit); best[size-11+c][r]=vBit(bit); bit++; }
    }
    return { version, size, matrix: best };
  }

  return { encode };
})();

gen('qrcode','QR Code', root => {
  root.innerHTML = `
    <div class="field"><label>Content (text, URL, etc.)</label><textarea id="qrText" placeholder="https://example.com"></textarea></div>
    <div class="row">
      <div class="field"><label>Error correction</label><select id="qrEc">
        <option value="L">L — low (7%)</option>
        <option value="M" selected>M — medium (15%)</option>
        <option value="Q">Q — quartile (25%)</option>
        <option value="H">H — high (30%)</option>
      </select></div>
      <div class="field"><label>Module size (px)</label><input type="number" id="qrScale" value="6" min="2" max="20"></div>
    </div>
    <div id="qrOutWrap" style="text-align:center;padding:10px 0"></div>
    <div class="hint" id="qrInfo">Generates entirely in-browser — nothing is sent anywhere. Supports up to ~2900 characters depending on error correction level.</div>
    <div class="segrow" id="qrActions" style="display:none">
      <button class="btn primary" id="qrDownload">Download PNG</button>
    </div>
  `;
  const txt = root.querySelector('#qrText');
  const ecSel = root.querySelector('#qrEc');
  const scaleInp = root.querySelector('#qrScale');
  const wrap = root.querySelector('#qrOutWrap');
  const info = root.querySelector('#qrInfo');
  const actions = root.querySelector('#qrActions');
  let lastCanvas = null;
  function render(){
    const text = txt.value;
    actions.style.display = 'none';
    if(!text){ wrap.innerHTML=''; info.textContent='Generates entirely in-browser — nothing is sent anywhere. Supports up to ~2900 characters depending on error correction level.'; return; }
    try{
      const {version, size, matrix} = QR.encode(text, ecSel.value);
      const scale = parseInt(scaleInp.value)||6;
      const quiet = 4;
      const dim = (size + quiet*2) * scale;
      const canvas = document.createElement('canvas');
      canvas.width = dim; canvas.height = dim;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,dim,dim);
      ctx.fillStyle = '#000';
      for(let r=0;r<size;r++) for(let c=0;c<size;c++){
        if(matrix[r][c]) ctx.fillRect((c+quiet)*scale, (r+quiet)*scale, scale, scale);
      }
      canvas.style.maxWidth='100%'; canvas.style.border='1px solid var(--line)'; canvas.style.borderRadius='10px';
      wrap.innerHTML=''; wrap.appendChild(canvas);
      lastCanvas = canvas;
      info.textContent = `Version ${version} (${size}×${size} modules) · EC level ${ecSel.value} · ${new TextEncoder().encode(text).length} bytes encoded.`;
      actions.style.display='flex';
    }catch(e){
      wrap.innerHTML=''; info.textContent = e.message;
    }
  }
  root.querySelector('#qrDownload').addEventListener('click', ()=>{
    if(!lastCanvas) return;
    const a = document.createElement('a');
    a.download = 'qrcode.png';
    a.href = lastCanvas.toDataURL('image/png');
    a.click();
  });
  [txt,ecSel,scaleInp].forEach(el=>el.addEventListener('input', render));
});

gen('lorem','Lorem Ipsum', root => {
  const WORDS = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum'.split(' ');
  root.innerHTML = `
    <div class="row">
      <div class="field"><label>Generate</label><select id="loType"><option value="paragraphs">Paragraphs</option><option value="sentences">Sentences</option><option value="words">Words</option></select></div>
      <div class="field"><label>Count</label><input type="number" id="loCount" value="3" min="1" max="50"></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-soft);margin-bottom:10px"><input type="checkbox" id="loStart" checked> Start with "Lorem ipsum dolor sit amet..."</label>
    <div class="segrow"><button class="btn primary" id="loGo">Generate</button></div>
    <div class="output" id="loOut">Result will appear here.</div>`;
  function randWord(){ return WORDS[Math.floor(Math.random()*WORDS.length)]; }
  function sentence(minW,maxW){
    const n = minW + Math.floor(Math.random()*(maxW-minW));
    const words = Array.from({length:n}, randWord);
    const s = words.join(' ');
    return s.charAt(0).toUpperCase()+s.slice(1)+'.';
  }
  function paragraph(){
    const n = 3 + Math.floor(Math.random()*4);
    return Array.from({length:n}, ()=>sentence(6,16)).join(' ');
  }
  root.querySelector('#loGo').addEventListener('click', ()=>{
    const type = root.querySelector('#loType').value;
    const count = parseInt(root.querySelector('#loCount').value)||1;
    const startClassic = root.querySelector('#loStart').checked;
    let out=[];
    if(type==='words'){ out=[Array.from({length:count}, randWord).join(' ')]; }
    else if(type==='sentences'){ out = Array.from({length:count}, ()=>sentence(6,16)); out=[out.join(' ')]; }
    else { out = Array.from({length:count}, paragraph); }
    if(startClassic && out.length){
      out[0] = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. ' + out[0];
    }
    root.querySelector('#loOut').textContent = out.join('\n\n');
  });
});

gen('multinumgen','Multiple Numbers Generator', root => {

    <div class="row">

      </div>
    </div>

    <div class="output" id="mgOut">Result will appear here.</div>`;
  root.querySelector('#mgGo').addEventListener('click', ()=>{
    const min = parseInt(root.querySelector('#mgMin').value)||0;
    const max = parseInt(root.querySelector('#mgMax').value)||0;
    const lo = Math.min(min,max), hi = Math.max(min,max);
    const count = parseInt(root.querySelector('#mgCount').value)||1;
    const unique = root.querySelector('#mgUnique').checked;
    const sort = root.querySelector('#mgSort').checked;
    const out = root.querySelector('#mgOut');
    if(unique && (hi-lo+1) < count){ out.textContent = `Range only has ${hi-lo+1} possible values — can't generate ${count} unique numbers.`; return; }

gen('scanner','Barcode/QR code Scanner', root => {
  root.innerHTML = `
    <div style="text-align:center">
      <video id="scanVideo" style="width:100%;max-width:400px;border-radius:12px;border:1px solid var(--line);background:#000" muted playsinline></video>
      <div><button class="btn primary" id="scanBtn" style="margin-top:14px">Start camera</button> <button class="btn" id="scanStop" style="margin-top:14px;display:none">Stop</button></div>
      <div class="output" id="scanOut" style="text-align:left;margin-top:16px">No result yet.</div>
      <div class="hint">Uses your browser's built-in barcode detector — no server, no external library. Available in Chrome/Edge on Android and desktop; not yet supported in all browsers.</div>
    </div>`;
  const video = root.querySelector('#scanVideo');
  const out = root.querySelector('#scanOut');
  const startBtn = root.querySelector('#scanBtn');
  const stopBtn = root.querySelector('#scanStop');
  let stream=null, raf=null, detector=null;
  async function start(){
    if(!('BarcodeDetector' in window)){ out.textContent='This browser does not support the built-in BarcodeDetector API. Try Chrome or Edge on Android/desktop.'; return; }
    try{
      detector = new window.BarcodeDetector({formats:['qr_code','ean_13','ean_8','code_128','upc_a','upc_e','code_39']});
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      video.srcObject = stream; await video.play();
      startBtn.style.display='none'; stopBtn.style.display='inline-block';
      scanLoop();
    }catch(e){ out.textContent = 'Camera access failed: '+e.message; }
  }
  async function scanLoop(){
    if(!stream) return;
    try{
      const codes = await detector.detect(video);
      if(codes.length){ out.textContent = codes.map(c=>`[${c.format}] ${c.rawValue}`).join('\n'); }
    }catch(e){}
    raf = requestAnimationFrame(scanLoop);
  }
  function stop(){
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    if(raf) cancelAnimationFrame(raf);
    video.srcObject = null;
    startBtn.style.display='inline-block'; stopBtn.style.display='none';
  }
  setCleanup(stop);
  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
});

      <tr><td>Mode</td><td id="a5">—</td></tr><tr><td>Min</td><td id="a6">—</td></tr><tr><td>Max</td><td id="a7">—</td></tr>

  root.querySelector('#avIn').addEventListener('input', e=>{
    const nums = e.target.value.split(/[,\n]+/).map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n));

    const sorted=[...nums].sort((a,b)=>a-b);
    const sum=nums.reduce((a,b)=>a+b,0);
    const mean=sum/nums.length;
    const mid=Math.floor(sorted.length/2);
    const median = sorted.length%2? sorted[mid] : (sorted[mid-1]+sorted[mid])/2;
    const freq={}; nums.forEach(n=>freq[n]=(freq[n]||0)+1);
    const maxFreq = Math.max(...Object.values(freq));
    const modes = Object.keys(freq).filter(k=>freq[k]===maxFreq);
    root.querySelector('#a1').textContent=nums.length;
    root.querySelector('#a2').textContent=fmtNum(sum);
    root.querySelector('#a3').textContent=fmtNum(mean);
    root.querySelector('#a4').textContent=fmtNum(median);

    root.querySelector('#a6').textContent=fmtNum(sorted[0]);
    root.querySelector('#a7').textContent=fmtNum(sorted[sorted.length-1]);
  });
});

  function factors(n){ const f=[]; let d=2; while(n>1){ while(n%d===0){ f.push(d); n/=d; } d++; if(d*d>n && n>1){ f.push(n); break; } } return f; }

function shapeCalc(id, name, fields, computeFn){
  calc('2D Geometry', id, name, root=>{
    root.innerHTML = `<div class="row">${fields.map(f=>`<div class="field"><label>${f.label}</label><input type="number" id="${f.id}" placeholder="${f.ph||''}"></div>`).join('')}</div>
      <table class="mono" id="shOut"></table>`;
    function update(){
      const vals = {}; let ok=true;
      fields.forEach(f=>{ const v=parseFloat(root.querySelector('#'+f.id).value); vals[f.id]=v; if(isNaN(v) || v<=0) ok=false; });
      const out = root.querySelector('#shOut');
      if(!ok){ out.innerHTML = root.querySelectorAll('input').length && [...root.querySelectorAll('input')].some(i=>i.value!=='') ? '<tr><td colspan="2">All dimensions must be positive numbers.</td></tr>' : ''; return; }
      const results = computeFn(vals);
      out.innerHTML = Object.entries(results).map(([k,v])=>`<tr><td>${k}</td><td>${fmtNum(v,4)}</td></tr>`).join('');
    }
    root.querySelectorAll('input').forEach(el=>el.addEventListener('input', update));
  });
}

calc('Advanced Math','graphplotter','Graph Plotter', root=>{
  root.innerHTML = `
    <div class="field"><label>Function y = f(x)</label><input type="text" id="gpFn" value="sin(x)"></div>
    <div class="row">
      <div class="field"><label>X min</label><input type="number" id="gpXmin" value="-10"></div>
      <div class="field"><label>X max</label><input type="number" id="gpXmax" value="10"></div>
    </div>
    <canvas id="gpCanvas" width="600" height="320" style="max-width:100%;border:1px solid var(--line);border-radius:10px;margin-top:10px"></canvas>
    <div class="output" id="gpOut" style="display:none"></div>`;
  const canvas = root.querySelector('#gpCanvas'), ctx = canvas.getContext('2d');
  function safeFn(expr){
    const cleaned = expr.replace(/\^/g,'**');
    if(!/^[0-9a-zA-Z+\-*/().,\s]*$/.test(cleaned)) throw new Error('Invalid characters');
    const fn = Function('x','with(Math){ return '+cleaned+'; }');
    return fn;
  }
  function draw(){
    const w=canvas.width, h=canvas.height;
    ctx.clearRect(0,0,w,h);
    const xmin=+root.querySelector('#gpXmin').value, xmax=+root.querySelector('#gpXmax').value;
    const out = root.querySelector('#gpOut');
    if(xmax<=xmin){ out.style.display='block'; out.textContent='X max must be greater than X min.'; return; }
    let fn;
    try{ fn = safeFn(root.querySelector('#gpFn').value); out.style.display='none'; }
    catch(e){ out.style.display='block'; out.textContent='Invalid function.'; return; }
    const pts = [];
    let ymin=Infinity, ymax=-Infinity;
    for(let i=0;i<=400;i++){
      const x = xmin+(xmax-xmin)*i/400;
      let y; try{ y=fn(x); }catch(e){ y=NaN; }
      if(Number.isFinite(y)){ ymin=Math.min(ymin,y); ymax=Math.max(ymax,y); }
      pts.push([x,y]);
    }
    if(!Number.isFinite(ymin)){ out.style.display='block'; out.textContent='Function did not produce plottable values.'; return; }
    if(ymin===ymax){ ymin-=1; ymax+=1; }
    const padY = (ymax-ymin)*0.1; ymin-=padY; ymax+=padY;
    function toPx(x,y){ return [ (x-xmin)/(xmax-xmin)*w, h-(y-ymin)/(ymax-ymin)*h ]; }
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line') || '#ddd';
    ctx.lineWidth=1;
    if(xmin<=0 && xmax>=0){ const [x0]=toPx(0,0); ctx.beginPath(); ctx.moveTo(x0,0); ctx.lineTo(x0,h); ctx.stroke(); }
    if(ymin<=0 && ymax>=0){ const [,y0]=toPx(0,0); ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(w,y0); ctx.stroke(); }
    const lineColor = (getComputedStyle(document.documentElement).getPropertyValue('--accent')||'#3fcb6b').trim() || '#3fcb6b';
    ctx.strokeStyle = lineColor;
    ctx.lineWidth=2;
    ctx.beginPath();
    let started=false;
    pts.forEach(([x,y])=>{
      if(!Number.isFinite(y)){ started=false; return; }
      const [px,py] = toPx(x,y);
      if(!started){ ctx.moveTo(px,py); started=true; } else ctx.lineTo(px,py);
    });
    ctx.stroke();
  }
  root.querySelectorAll('input').forEach(el=>el.addEventListener('input', draw));
  draw();
});

    const a=+root.querySelector('#qA').value, b=+root.querySelector('#qB').value, c=+root.querySelector('#qC').value;

    if(a===0){ out.textContent = b!==0 ? `Linear equation: x = ${fmtNum(-c/b,6)}` : 'Not a valid equation.'; return; }
    const disc = b*b-4*a*c;
    if(disc>0){
      const x1=(-b+Math.sqrt(disc))/(2*a), x2=(-b-Math.sqrt(disc))/(2*a);
      out.textContent = `Two real roots:\nx₁ = ${fmtNum(x1,6)}\nx₂ = ${fmtNum(x2,6)}`;
    } else if(disc===0){
      out.textContent = `One real root:\nx = ${fmtNum(-b/(2*a),6)}`;
    } else {
      const re=-b/(2*a), im=Math.sqrt(-disc)/(2*a);
      out.textContent = `Two complex roots:\nx₁ = ${fmtNum(re,6)} + ${fmtNum(im,6)}i\nx₂ = ${fmtNum(re,6)} − ${fmtNum(im,6)}i`;
    }
  }
  root.querySelectorAll('input').forEach(el=>el.addEventListener('input', update));
  update();
});

/* ================================================================
   UNIT CONVERTER — ~31 unit types
   ================================================================ */
TOOLS.unit = [];
let UNIT_N = 0;
function uconv(group, id, name, units){
  UNIT_N++;
  TOOLS.unit.push({id, code:'UNI-'+String(UNIT_N).padStart(2,'0'), name, group, render(root){
    const opts = units.map(u=>`<option value="${u.key}">${u.label}</option>`).join('');
    root.innerHTML = `
      <div class="field"><label>Value</label><input type="number" id="ucVal" value="1"></div>
      <div class="row">
        <div class="field"><label>From</label><select id="ucFrom">${opts}</select></div>
        <div class="field"><label>To</label><select id="ucTo">${opts}</select></div>
      </div>
      <div class="output" id="ucOut">—</div>
      <div class="divider"></div>
      <div class="section-label" style="margin:0 0 10px">All units</div>
      <table class="mono" id="ucTable"></table>
    `;
    const val = root.querySelector('#ucVal'), from = root.querySelector('#ucFrom'), to = root.querySelector('#ucTo');
    if(units[1]) to.value = units[1].key;
    // With the imperial preference set, a converter opens on the unit that
    // preference implies rather than on whatever happened to be second.
    const IMPERIAL_DEFAULT = { length: ['ft', 'mi'], mass: ['lb'], volume: ['gal'], temperature: ['F'], speed: ['mph'] };
    const preferred = IMPERIAL_DEFAULT[id];
    if(prefUnits() === 'imperial' && preferred){
      const pick = preferred.find(k=>units.some(u=>u.key === k));
      if(pick) to.value = pick;
    }
    const memKey = 'unit-last-'+id;
    const mem = store.get(memKey, null);
    if(mem){
      if(units.some(u=>u.key===mem.from)) from.value = mem.from;
      if(units.some(u=>u.key===mem.to)) to.value = mem.to;
    }
    function update(){
      const v = parseFloat(val.value); 
      const out = root.querySelector('#ucOut'), table = root.querySelector('#ucTable');
      if(isNaN(v)){ out.textContent='—'; table.innerHTML=''; return; }
      const fu = units.find(u=>u.key===from.value), tu = units.find(u=>u.key===to.value);
      const base = v*fu.factor;
      const result = base/tu.factor;
      store.set('unit-last-'+id, {from: from.value, to: to.value});
      out.innerHTML = `<span class="big">${fmtNum(result,6)}</span> ${tu.label}`;
      table.innerHTML = units.map(u=>`<tr><td>${u.label}</td><td>${fmtNum(base/u.factor,6)}</td></tr>`).join('');
    }
    [val,from,to].forEach(el=>el.addEventListener('input', update));
    update();
  }});
}

fin('taxcalc','Tax Calculator', root=>{
  root.innerHTML = `
    <div class="field"><label>Income</label><input type="number" id="txIncome" value="60000"></div>
    <div class="hint">Enter your own tax brackets below (this varies by country/year, so nothing is pre-filled with authority). Each row: taxable amount up to this threshold is taxed at this rate; leave the last threshold blank for "and above".</div>
    <div id="txBrackets"></div>
    <div class="segrow"><button class="btn" id="txAdd">+ Add bracket</button></div>
    <div class="output" id="txOut" style="margin-top:16px">—</div>`;
  let brackets = [ {upto:10000, rate:10}, {upto:40000, rate:20}, {upto:'', rate:30} ];
  const box = root.querySelector('#txBrackets');
  function drawBrackets(){
    box.innerHTML = brackets.map((b,i)=>`
      <div class="row" data-i="${i}">
        <div class="field"><label>Up to</label><input type="number" class="bUpto" value="${b.upto}" placeholder="(and above)"></div>
        <div class="field"><label>Rate %</label><input type="number" class="bRate" value="${b.rate}"></div>
        <button class="btn ghost bRemove" style="flex:none;align-self:flex-end;margin-bottom:14px" aria-label="Remove">✕</button>
      </div>`).join('');
    box.querySelectorAll('[data-i]').forEach(row=>{
      const i = +row.dataset.i;
      row.querySelector('.bUpto').addEventListener('input', e=>{ brackets[i].upto = e.target.value===''?'':+e.target.value; update(); });
      row.querySelector('.bRate').addEventListener('input', e=>{ brackets[i].rate = +e.target.value; update(); });
      row.querySelector('.bRemove').addEventListener('click', ()=>{ brackets.splice(i,1); drawBrackets(); update(); });
    });
  }
  root.querySelector('#txAdd').addEventListener('click', ()=>{ brackets.push({upto:'',rate:0}); drawBrackets(); update(); });
  function update(){
    const income = +root.querySelector('#txIncome').value;
    const out = root.querySelector('#txOut');
    if(!income){ out.textContent='—'; return; }
    let remaining = income, prevThreshold = 0, tax = 0, breakdown=[];
    for(const b of brackets){
      const upto = b.upto===''? Infinity : b.upto;
      const bandSize = Math.max(0, Math.min(remaining, upto-prevThreshold));
      const bandTax = bandSize*b.rate/100;
      if(bandSize>0) breakdown.push(`${fmtNum(bandSize,2)} @ ${b.rate}% = ${fmtNum(bandTax,2)}`);
      tax += bandTax;
      remaining -= bandSize;
      prevThreshold = upto;
      if(remaining<=0) break;
    }
    out.innerHTML = `<span class="big">${fmtNum(tax,2)}</span> total tax\n\nEffective rate: ${fmtNum(tax/income*100,2)}%\nNet income: ${fmtNum(income-tax,2)}\n\n${breakdown.join('\n')}`;
  }
  root.querySelector('#txIncome').addEventListener('input', update);
  drawBrackets(); update();
});

rnd('luckywheel','Lucky Wheel', root=>{
  root.innerHTML = `
    <div class="field"><label>Options (one per line)</label><textarea id="lwOptions">Pizza\nBurger\nSushi\nTacos\nSalad\nPasta</textarea></div>
    <div style="text-align:center;margin:20px 0">
      <div style="position:relative;width:260px;height:260px;margin:0 auto">
        <div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--ink)"></div>
        <svg id="lwWheel" viewBox="0 0 200 200" style="width:100%;height:100%;transition:transform 4s cubic-bezier(0.15,0.8,0.15,1);transform:rotate(0deg)"></svg>
      </div>
      <button class="btn primary" id="lwSpin" style="margin-top:18px">Spin</button>
    </div>
    <div class="output" id="lwOut" style="text-align:center">Result will appear here.</div>`;
  const COLORS = ['#E31C7D','#E6A400','#9FCB1B','#F4483D','#2F86EB','#A93CF5','#3FCB6B','#22D9D9','#1FCE9C','#12A99A','#F2871A'];
  const wheel = root.querySelector('#lwWheel');
  const out = root.querySelector('#lwOut');
  let rotation = 0;
  function getOptions(){ return root.querySelector('#lwOptions').value.split('\n').map(s=>s.trim()).filter(Boolean); }
  function draw(){
    const opts = getOptions();
    const n = opts.length;
    if(n<2){ wheel.innerHTML = ''; return; }
    const segAngle = 360/n;
    let svg = '';
    for(let i=0;i<n;i++){
      const start = i*segAngle - 90, end = (i+1)*segAngle - 90;
      const x1 = 100+90*Math.cos(start*Math.PI/180), y1 = 100+90*Math.sin(start*Math.PI/180);
      const x2 = 100+90*Math.cos(end*Math.PI/180), y2 = 100+90*Math.sin(end*Math.PI/180);
      const large = segAngle>180?1:0;
      svg += `<path d="M100,100 L${x1},${y1} A90,90 0 ${large} 1 ${x2},${y2} Z" fill="${COLORS[i%COLORS.length]}"/>`;
      const mid = i*segAngle+segAngle/2-90;
      const tx = 100+58*Math.cos(mid*Math.PI/180), ty = 100+58*Math.sin(mid*Math.PI/180);
      svg += `<text x="${tx}" y="${ty}" fill="#fff" font-size="9" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle" transform="rotate(${mid+90} ${tx} ${ty})">${escapeHtml(opts[i].length>12?opts[i].slice(0,11)+'…':opts[i])}</text>`;
    }
    svg += `<circle cx="100" cy="100" r="8" fill="var(--paper)" stroke="var(--line)" stroke-width="2"/>`;
    wheel.innerHTML = svg;
  }
  root.querySelector('#lwOptions').addEventListener('input', draw);
  let spinning = false;
  root.querySelector('#lwSpin').addEventListener('click', ()=>{
    if(spinning) return;
    const opts = getOptions();
    const n = opts.length;
    if(n<2){ out.textContent='Add at least 2 options.'; return; }
    spinning = true;
    const target = Math.floor(Math.random()*n);
    const segAngle = 360/n;
    const a = target*segAngle + segAngle/2 + (Math.random()-0.5)*segAngle*0.6;
    let R = ((-a)%360+360)%360;
    while(R <= rotation + 5*360) R += 360;
    rotation = R;
    wheel.style.transform = `rotate(${rotation}deg)`;
    out.textContent = 'Spinning…';
    setTimeout(()=>{ out.innerHTML = `<span class="big">${escapeHtml(opts[target])}</span>`; spinning=false; }, 4000);
  });
  draw();
});

      <option value="Sedentary">Sedentary</option>

      <button class="btn ghost" id="chClearEntries">Clear all</button>
    </div>
    <div class="divider"></div>
    <div id="chExportJson"></div>`;

  const ACTIVITY_MULT = {'Sedentary':1.2,'Lightly Active':1.375,'Active':1.55,'Very Active':1.725};
  const PROTEIN_FACTOR = {'Sedentary':0.8,'Lightly Active':1.2,'Active':1.6,'Very Active':2.0};
  let entries = store.get('clinical-health-entries', []);

  function persist(){ store.set('clinical-health-entries', entries); }
  exportImportRow(root.querySelector('#chExportJson'), 'clinical-health-entries', 'kitbox-clinical-health.json', data=>{ entries = data||[]; drawEntries(); });

    root.querySelector('#chWLbsField').style.display = v==='lbs' ? 'block':'none';
    update();
  });

  function getHeightCm(){
    const unit = root.querySelector('#chHUnit').value;
    if(unit==='cm') return +root.querySelector('#chHCm').value||0;
    if(unit==='m') return (+root.querySelector('#chHM').value||0)*100;
    const ft = +root.querySelector('#chHFt').value||0, inch = +root.querySelector('#chHIn').value||0;
    return (ft*12+inch)*2.54;
  }
  function getWeightKg(){
    const unit = root.querySelector('#chWUnit').value;
    if(unit==='kg') return +root.querySelector('#chWKg').value||0;
    return (+root.querySelector('#chWLbs').value||0)/2.20462;
  }
  function calc(){
    const age = +root.querySelector('#chAge').value||0;
    const gender = root.querySelector('#chGender').value;
    const heightCm = getHeightCm(), weightKg = getWeightKg();
    const activity = root.querySelector('#chAct').value;
    if(!age||!heightCm||!weightKg) return null;
    const heightM = heightCm/100;
    const bmi = weightKg/(heightM*heightM);
    const bmr = gender==='M' ? 10*weightKg+6.25*heightCm-5*age+5 : 10*weightKg+6.25*heightCm-5*age-161;
    const tdee = bmr*ACTIVITY_MULT[activity];
    const protein = PROTEIN_FACTOR[activity]*weightKg;
    const fat = (0.25*tdee)/9;

function beautifyCSS(css){
  css = css.replace(/\s+/g,' ').trim();
  let out=''; let indent=0;
  for(let i=0;i<css.length;i++){
    const c = css[i];
    if(c==='{'){ out=out.replace(/\s+$/,''); out+=' {\n'+'  '.repeat(indent+1); indent++; }
    else if(c==='}'){ out=out.replace(/[ ]+$/,''); indent=Math.max(0,indent-1); out+='\n'+'  '.repeat(indent)+'}\n'+'  '.repeat(indent); }
    else if(c===';'){ out+=';\n'+'  '.repeat(indent); }
    else out+=c;
  }
  out = out.split('\n').map(l=>{
    l = l.trimEnd();
    const m = l.match(/^(\s*)([a-zA-Z-]+)\s*:\s*(.+)$/);
    if(m && !l.includes('{')) return m[1]+m[2]+': '+m[3];
    return l;
  }).join('\n').replace(/\n{2,}/g,'\n').trim();
  return out;
}

function beautifyMarkup(input, isHtml){
  const VOID = new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
  let xml = input.replace(/>\s*</g,'><').trim();
  const parts = xml.split(/(<[^>]+>)/g).filter(p=>p!=='');
  let pad=0; let out=[];
  parts.forEach(part=>{
    if(part.startsWith('<')){
      const tagMatch = part.match(/^<\/?([a-zA-Z0-9:_-]+)/);
      const tagName = tagMatch? tagMatch[1].toLowerCase() : '';
      const isClosing = part.startsWith('</');
      const isSelfClosing = /\/>$/.test(part) || (isHtml && VOID.has(tagName));
      const isDecl = part.startsWith('<?') || part.startsWith('<!');
      if(isClosing){
        pad = Math.max(0,pad-1);
        out.push('  '.repeat(pad)+part);
      } else {
        out.push('  '.repeat(pad)+part);
        if(!isSelfClosing && !isDecl) pad++;
      }
    } else {
      const text = part.trim();
      if(text) out.push('  '.repeat(pad)+text);
    }
  });
  return out.join('\n');
}
