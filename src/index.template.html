<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitbox — Offline Toolbox</title>
<meta name="description" content="Kitbox — a single-file offline toolbox. Every tool runs locally in your browser: no server, no account, no tracking, no network.">
<!-- Installability without a second file. iOS honours the apple-* tags and
     the touch icon; Chrome requires a same-origin manifest, which a single
     file cannot provide, so it offers "install" from the menu instead. The
     data: manifest below is for browsers that accept it. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitbox">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230b0e14'/%3E%3Crect x='40' y='62' width='100' height='70' fill='%232f86eb'/%3E%3Crect x='40' y='86' width='100' height='12' fill='%230b0e14'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Kitbox%22%2C%22short_name%22%3A%22Kitbox%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0e14%22%2C%22theme_color%22%3A%22%230b0e14%22%7D">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark light">
<!-- Everything the page needs is in the page. This says so in a way the
     browser enforces: no network of any kind, no frames, no forms, and images
     only from data: or blob: URIs that the app itself created. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0e14'/%3E%3Crect x='6' y='10' width='20' height='14' fill='%232f86eb'/%3E%3Crect x='6' y='14' width='20' height='2.5' fill='%230b0e14'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#17171d;
    --ink-soft:#5a5a62;
    --paper:#0b0e14;
    --panel:#ffffff;
    --line:#e4e4e2;
    --line-strong:#d8d8d5;
    --muted:#9a9a9f;
    --shell-muted:#a7adb9;
    --radius:0px;
    --tile-gap:6px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
    --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  :focus-visible{ outline:2px solid var(--accent, #2f86eb); outline-offset:2px; }
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--shell-muted);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Top bar (Windows 10 dark chrome) ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:16px;
    padding:16px 22px;
    background:#0e121a;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .backbtn{
    width:34px;height:34px;border-radius:0;border:none;
    background:transparent; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none; color:#fff;
  }
  .backbtn:hover{background:rgba(255,255,255,0.09);}
  .backbtn svg{width:18px;height:18px;}
  .backbtn.hidden{visibility:hidden;}
  .brand{
    font-family:var(--sans); font-weight:600; letter-spacing:0.01em;
    font-size:15px; display:flex; align-items:center; gap:9px; color:#fff;
  }
  .brand .dot{width:12px;height:12px;border-radius:0;background:var(--accent,#2f86eb); transition:background .2s;}
  .crumb{
    font-size:13.5px; color:var(--shell-muted); margin-left:2px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .crumb b{color:#fff; font-weight:600;}

  /* ---------- Layout ---------- */
  .wrap{max-width:1040px; margin:0 auto; padding:32px 22px 80px;}
  .hero{
    display:flex; gap:18px; align-items:flex-start;
    padding:6px 2px 32px;
  }
  .hero .badge{
    flex:none; width:52px; height:52px; border-radius:0;
    background:var(--accent, #2f86eb); color:#fff;
    border:none;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:700; font-size:12px;
  }
  .hero h1{font-size:26px; margin:2px 0 10px; letter-spacing:-0.01em; font-weight:600; color:#fff;}
  .hero p{font-size:14.5px; color:var(--shell-muted); margin:0; max-width:58ch; line-height:1.6;}

  .section-label{
    font-family:var(--sans); font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--shell-muted); margin:0 2px 12px; font-weight:600;
  }

  /* ---------- Grid & tiles (Windows 10 Start Menu style) ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:var(--tile-gap);
  }
  @media(min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:900px){ .grid{grid-template-columns:repeat(4,1fr);} }

  .tag{
    position:relative;
    background:var(--c, var(--accent, #2f86eb));
    border:none; border-radius:var(--radius);
    padding:14px; cursor:pointer; text-align:left;
    color:#fff;
    transition:filter .1s ease, transform .06s ease;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08);
    display:flex; flex-direction:column; justify-content:space-between; gap:16px; min-height:112px;
  }
  .tag:hover{ filter:brightness(1.12); }
  .tag:active{ transform:scale(0.95); filter:brightness(0.92); }
  .tag .hole{ display:none; }
  .tag .icon{
    width:28px; height:28px; border-radius:0;
    background:transparent;
    color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .tag .icon svg{width:22px;height:22px;}
  .tag .name{font-size:13.5px; font-weight:600; line-height:1.25; color:var(--ci,#fff);}
  .tag .code{color:var(--ci,#fff);
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; color:rgba(255,255,255,0.8); margin-top:auto;
  }
  .tag.disabled{opacity:0.35; cursor:default; filter:grayscale(0.7);}
  .tag.disabled:hover{filter:grayscale(0.7);}

  .catband{
    border-radius:0; padding:0 0 8px; margin-bottom:28px;
  }

  /* ---------- Tool detail panel (light "app window") ---------- */
  .panel{
    background:var(--panel); border:none; border-radius:var(--radius);
    padding:30px; margin-top:4px; color:var(--ink);
    box-shadow:0 1px 0 rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.05);
  }
  .panel h2{margin:0 0 10px; font-size:20px; font-weight:600; color:var(--ink);}
  .panel .code-pill{
    display:inline-block; font-family:var(--mono); font-size:11px; color:#fff;
    background:var(--accent); border:none; padding:4px 10px; border-radius:0; letter-spacing:.05em;
    margin-bottom:8px;
  }
  .field{margin:18px 0;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:7px; font-weight:600;}
  .field input[type=text], .field input[type=number], .field input[type=datetime-local], .field select, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:0;
    font-size:14.5px; background:#fff; color:var(--ink); font-family:var(--sans);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .field textarea{font-family:var(--mono); font-size:13.5px; min-height:90px; resize:vertical;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:120px;}
  .btn{
    padding:10px 18px; border-radius:0; border:1px solid var(--line); background:#fff;
    font-size:14px; font-weight:600; cursor:pointer; color:var(--ink);
  }
  .btn:hover{ background:#f4f4f3; }
  .btn.primary{background:var(--accent); color:#fff; border-color:transparent;}
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
  .btn.ghost:hover{ background:#f4f4f3; }
  .btn:active{transform:scale(0.98);}
  .output{
    margin-top:20px; padding:16px 18px; background:#fafafa; border:1px solid var(--line);
    border-radius:0; font-family:var(--mono); font-size:14px; white-space:pre-wrap; word-break:break-word;
    min-height:20px; color:var(--ink);
  }
  .output .big{font-size:26px; font-weight:700; font-family:var(--sans); color:var(--ink);}
  .hint{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5;}
  .divider{height:1px; background:var(--line); margin:22px 0;}
  .counter-display{font-family:var(--mono); font-size:52px; font-weight:600; text-align:center; padding:28px 0; color:var(--ink);}
  .segrow{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .segrow .btn{min-width:70px;}
  table.mono{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:13px; color:var(--ink);}
  table.mono td, table.mono th{padding:8px 8px; border-bottom:1px solid var(--line); text-align:left;}
  .ruler-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:0; background:#fff; padding:16px 0 0;}
  .ruler{position:relative; height:70px;}
  .ruler .tick{position:absolute; bottom:0; width:1px; background:var(--ink-soft);}
  .ruler .lbl{position:absolute; bottom:22px; font-size:10px; font-family:var(--mono); transform:translateX(-50%); color:var(--muted);}
  .score-card{border:1px solid var(--line); border-radius:0; padding:18px; text-align:center; color:var(--ink);}
  .score-card input{border:none; background:transparent; text-align:center; font-weight:600; font-size:14.5px; width:100%; font-family:var(--sans); color:var(--ink);}
  .score-card .num{font-family:var(--mono); font-size:38px; font-weight:600; margin:10px 0; color:var(--ink);}
  .team-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .footer-note{text-align:center; color:var(--shell-muted); font-size:12px; margin-top:56px;}
  .empty{
    text-align:center; padding:80px 20px; color:var(--muted); font-size:14px;
  }
  ::selection{background:color-mix(in srgb, var(--accent, #2f86eb) 30%, transparent);}

  /* ---------- Search, palette, A–Z list (added in the merged build) ---------- */
  .searchbar{position:relative; margin:0 0 26px;}
  .searchbar input{width:100%; background:#121722; border:1px solid rgba(255,255,255,0.12); color:#fff;
    padding:13px 92px 13px 15px; font-family:var(--sans); font-size:14.5px; border-radius:0;}
  .searchbar input::placeholder{color:#6f7787;}
  .searchbar input:focus{outline:none; border-color:var(--accent,#2f86eb);}
  .kbdhint{position:absolute; right:12px; top:50%; transform:translateY(-50%); font-family:var(--mono);
    font-size:11px; color:#6f7787; border:1px solid rgba(255,255,255,0.12); padding:2px 6px;}
  .alist{display:flex; flex-direction:column; margin:0 0 22px;}
  .aitem{display:flex; justify-content:space-between; gap:12px; padding:8px 10px; text-decoration:none;
    color:#fff; font-size:13.5px; border-bottom:1px solid rgba(255,255,255,0.06);}
  .aitem:hover{background:rgba(255,255,255,0.06);}
  .aitem .acat{font-family:var(--mono); font-size:11.5px; opacity:0.9;}
  .palette-overlay{position:fixed; inset:0; background:rgba(5,7,11,0.72); z-index:100;
    display:flex; align-items:flex-start; justify-content:center; padding:12vh 16px 16px;}
  .palette-overlay[hidden]{display:none;}
  .palette{width:100%; max-width:620px; background:#11161f; border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 24px 60px rgba(0,0,0,0.55);}
  .palette input{width:100%; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,0.12);
    color:#fff; font-family:var(--sans); font-size:16px; padding:16px 18px;}
  .palette input:focus{outline:none;}
  .pal-list{max-height:52vh; overflow:auto;}
  .pal-item{display:flex; justify-content:space-between; gap:14px; width:100%; text-align:left;
    background:transparent; border:none; color:#e8eaee; font-family:var(--sans); font-size:14px;
    padding:11px 18px; cursor:pointer;}
  .pal-item.on{background:rgba(255,255,255,0.08);}
  .pal-item .pal-cat{font-family:var(--mono); font-size:11.5px; opacity:0.85;}
  .pal-group{font-family:var(--sans); font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:#6f7787; padding:12px 18px 6px;}
  .pal-empty{padding:18px; color:#8b93a1; font-size:13.5px;}
  .pal-foot{display:flex; gap:16px; padding:10px 18px; border-top:1px solid rgba(255,255,255,0.1);
    font-family:var(--mono); font-size:11px; color:#6f7787;}
  @media (max-width:640px){ .pal-foot{display:none;} }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  /* ---------- B1: quick wins ---------- */
  .skip{position:absolute; left:-9999px; top:8px; z-index:200; background:#fff; color:#000;
    padding:10px 14px; font-size:13px; font-weight:600; text-decoration:none;}
  .skip:focus{left:8px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .output{position:relative;}
  @media (hover:hover){
    .output:hover::after{content:"double-click to copy"; position:absolute; top:4px; right:9px;
      font-family:var(--mono); font-size:10px; color:var(--muted); opacity:.85; pointer-events:none;}
  }
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px);
    background:#11161f; color:#fff; border:1px solid rgba(255,255,255,.16); padding:10px 16px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:120;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .pal-item:focus-visible{outline:2px solid var(--accent,#2f86eb); outline-offset:-2px;}
  .crumblink{color:var(--shell-muted); text-decoration:none;}
  .crumblink:hover{color:#fff; text-decoration:underline;}
  .firstrun{margin:-14px 0 26px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .pastechip{position:absolute; z-index:60; background:#fff; border:1px solid var(--line-strong);
    color:var(--ink-soft); font-family:var(--sans); font-size:11.5px; font-weight:600;
    padding:4px 9px; cursor:pointer;}
  .pastechip:hover{background:#f4f4f3;}
  .chip{font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    border:1px solid #c0392b; color:#c0392b; padding:2px 6px; margin-left:6px; vertical-align:2px;}
  .newchip{font-family:var(--mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase;
    border:1px solid currentColor; padding:1px 4px; margin-left:6px; opacity:.8; vertical-align:1px;}
  /* There are no translucent surfaces in this app, so there is nothing for
     prefers-reduced-transparency to reduce. Recorded rather than ignored. */
  @media (prefers-contrast: more){
    :root{--shell-muted:#e3e7ee; --muted:#5b5b63;}
    .hint{color:#2f2f35;}
    .tag .code{opacity:1;}
    .output{background:#fff; border-color:#b9b9b5;}
  }
  @media print{
    .topbar,.searchbar,.firstrun,.footer-note,.palette-overlay,.kbdhint,#pinBtn,.skip,.toast{display:none !important;}
    body{background:#fff; color:#000;}
    .wrap{max-width:none; padding:0;}
    .panel{border:none; padding:0;}
    .panel h2,.panel .code-pill,.hero h1,.hero p{color:#000 !important;}
    .output{background:#fff; border:1px solid #ccc; color:#000;}
    a{color:#000; text-decoration:underline;}
  }
</style>
</head>
<body>
<a class="skip" href="#app">Skip to the tools</a>
<noscript>
  <div style="max-width:560px; margin:64px auto; padding:0 22px; color:#fff; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <h1 style="font-size:24px; margin:0 0 12px">Kitbox needs JavaScript</h1>
    <p style="color:#a7adb9; line-height:1.7; margin:0">Every tool in this file runs in your browser — there is no server to fall back on, which is exactly why nothing you open here can be uploaded anywhere. Turn JavaScript on for this page and reload.</p>
  </div>
</noscript>
<header class="topbar">
  <button class="backbtn hidden" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <div class="brand"><span class="dot" id="brandDot"></span>Kitbox</div>
  <div class="crumb" id="crumb"></div>
  <nav aria-label="App pages" style="display:flex;gap:0;margin-left:auto">
  <button class="backbtn" id="supportBtn" aria-label="Support Kitbox" style="color:#C2185B">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.6 2.9 5 6.5 5c2 0 3.3 1 5.5 3 2.2-2 3.5-3 5.5-3 3.6 0 5.8 3.6 4 7.5C19 16.65 12 21 12 21z"/></svg>
  </button>
  <button class="backbtn" id="aboutBtn" aria-label="About Kitbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
  </button>
  </nav>
</header>
<main class="wrap" id="app"></main>

<script>
{{JS}}</script>
</body>
</html>
