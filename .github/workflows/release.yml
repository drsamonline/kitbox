# A tag is a promise: this exact file, checksummed, downloadable, forever.
# The workflow refuses to publish if the tag and the app disagree, so a
# mistyped tag cannot ship the wrong build under the right name.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      - name: The app passes its own tests
        run: npm test

      - name: The tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(grep -o "APP_VERSION = '[^']*'" kitbox.html | head -1 | cut -d"'" -f2)
          echo "tag $tag, APP_VERSION $app"
          if [ "$tag" != "$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $app"
            exit 1
          fi

      - name: Build the artefacts
        run: |
          node tools/minify.js
          node test/minified.js
          python3 tools/dist.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            $0 ~ "^## " v { flag = 1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then echo "Kitbox $GITHUB_REF_NAME" > /tmp/notes.md; fi
          gh release create "$GITHUB_REF_NAME" \
            kitbox.html \
            dist/kitbox.html.gz \
            dist/kitbox.min.html \
            dist/kitbox.min.html.gz \
            index.html \
            dist/index.html.gz \
            dist/SHA256SUMS \
            --title "Kitbox ${GITHUB_REF_NAME#v}" \
            --notes-file /tmp/notes.md
