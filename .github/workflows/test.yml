# Kitbox has no build step — the app IS the artifact. What runs on a push is
# everything that keeps the four documents and the app from drifting apart.
name: test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install --quiet markdown

      - name: Test
        run: npm test

      - name: Accessibility audit (axe-core)
        run: npm run a11y

      - name: Fuzz every text field with markup payloads
        run: npm run fuzz

      - name: Drive every tool with input
        run: npm run interact

      - name: Fixtures, round trips and real files
        run: npm run deep

      - name: Every landing-page link resolves
        run: npm run links

      - name: Unit tests for the pure functions
        run: |
          node tools/build-lib.js
          node test/lib.js

      - name: Lint
        run: |
          python3 tools/build.py
          npx eslint dist/app.js

      - name: Typecheck the library
        run: |
          node tools/build-lib.js
          npx tsc -p tsconfig.json

      - name: Tool codes and ids are stable
        run: node tools/gen-codes.js --check

      - name: Badge numbers match the app
        run: node tools/check-badges.js

      - name: ALL_TOOLS.md matches the registry
        run: node tools/gen-all-tools.js --check

      - name: Landing page matches the app
        run: python3 tools/build-landing.py --check

      - name: docs/ matches the markdown
        run: python3 tools/build-docs.py --check

      - name: MANIFEST.json matches the tracked files
        run: python3 tools/check-manifest.py

      - name: Every roadmap item is scheduled in one batch
        run: python3 tools/check-plan.py

      # A loaded resource is fetched by the page by itself; a link is something
      # a person chooses to click. Only the first kind breaks the offline
      # promise. The support page's Ko-fi and PayPal links are deliberately
      # outbound.
      - name: Fail if the app loads anything external
        run: |
          if grep -Eq '<script[^>]+src="https?://|<link[^>]+href="https?://|<img[^>]+src="https?://' kitbox.html; then
            echo "kitbox.html loads an external resource"; exit 1
          fi
          echo "app: no external resources loaded"

      - name: Fail if the app contains a network call
        run: |
          if grep -Eq 'fetch\(|XMLHttpRequest|new WebSocket|EventSource' kitbox.html; then
            echo "kitbox.html contains a network call"; exit 1
          fi
          echo "app: no network calls"

      # Static checks can prove the dangerous primitives are absent. They
      # cannot prove that innerHTML is safe — that needs the fuzz pass
      # scheduled in PLAN.md B8.
      - name: Fail on eval, new Function, document.write or javascript URLs
        run: |
          fail=0
          grep -nE '[^a-zA-Z_.$]eval\(' kitbox.html && { echo "eval() in the app"; fail=1; }
          grep -n 'new Function' kitbox.html && { echo "new Function in the app"; fail=1; }
          grep -n 'document\.write' kitbox.html && { echo "document.write in the app"; fail=1; }
          grep -nE 'javascript:[^"]*"' kitbox.html && { echo "javascript: URL in the app"; fail=1; }
          [ "$fail" -eq 0 ] && echo "no eval, no Function constructor, no document.write, no javascript: URLs"
          exit $fail

      - name: Size budget
        run: |
          bytes=$(wc -c < kitbox.html)
          gz=$(gzip -9 -c kitbox.html | wc -c)
          # Two numbers, because they answer different questions.
          #
          # The gzipped size is what a user actually downloads, and it is the
          # budget that matters: 285 KB. It sat near 215 KB for many releases and
          # reached 260 KB at 428 tools, which is about 620 bytes gzipped per
          # tool — so 285 KB is one more batch of headroom, not a blank cheque.
          #
          # The raw size has no natural ceiling — every tool adds to it — so it
          # is a runaway guard, not a target, and it is deliberately coarse: one
          # megabyte. It was 640 KB at B1, 760 KB at B6, 860 KB at 2.4.0 and
          # 960 KB at 2.8.0, and 2.9.0 tripped it by 577 bytes — which is the
          # clearest possible argument that a fine-grained raw gate is measuring
          # the wrong thing. The gzip budget is the one that catches a real
          # regression; this one exists to catch a file that has doubled.
          raw_limit=$((1024 * 1024))
          gz_limit=$((285 * 1024))
          echo "kitbox.html: $((bytes / 1024)) KB raw (guard $((raw_limit / 1024)) KB), $((gz / 1024)) KB gzipped (budget $((gz_limit / 1024)) KB)"
          if [ "$gz" -gt "$gz_limit" ]; then
            echo "The download grew past 285 KB gzipped. That is a real regression: trim it, or raise the budget deliberately."
            exit 1
          fi
          if [ "$bytes" -gt "$raw_limit" ]; then
            echo "The raw file passed the runaway guard. Either trim it, or raise the guard in this workflow deliberately."
            exit 1
          fi

      - name: Build the minified copy
        run: node tools/minify.js

      - name: The minified copy behaves like the app
        run: node test/minified.js

      - name: Build the distribution artefacts
        run: python3 tools/dist.py

      - uses: actions/upload-artifact@v4
        with:
          name: kitbox-dist
          path: dist/
          if-no-files-found: error

      - name: Fail if the landing page loads anything external
        run: |
          if grep -Eq '<script[^>]+src="https?://|<link[^>]+href="https?://|<img[^>]+src="https?://' index.html; then
            echo "index.html loads an external resource"; exit 1
          fi
          echo "landing: no external resources loaded"
